name: Feature request
description: Suggest an idea for Pigoune
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the need or the problem first, before any solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could Pigoune help? Mockups and examples from other apps are welcome.
