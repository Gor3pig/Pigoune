name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check.sh
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Allow the image decoding sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run check.sh in Fedora 44
        run: >
          docker run --rm --privileged
          --volume "$PWD:/src:ro"
          registry.fedoraproject.org/fedora:44
          bash /src/.github/ci/check-in-fedora.sh
