name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild the Flatpak package for, such as v1.1.0
        required: true

permissions:
  contents: write

jobs:
  flatpak:
    name: Flatpak package
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Check that the version matches the tag
        run: |
          version=$(sed -n "s/^  version: '\(.*\)',$/\1/p" meson.build)
          if [ "v$version" != "$TAG" ]; then
            echo "meson.build says $version, but the tag is $TAG"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build the package
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --force-clean --repo=repo build build-aux/io.github.gor3pig.Pigoune.json
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo "pigoune-$VERSION.flatpak" io.github.gor3pig.Pigoune

      - name: Attach the package to the release
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "Pigoune $VERSION" \
              --notes "Release notes to be written before publishing."
          fi
          gh release upload "$TAG" "pigoune-$VERSION.flatpak" --clobber
