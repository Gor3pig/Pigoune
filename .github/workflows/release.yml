name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild the Flatpak package for, such as v1.1.0
        required: true

permissions:
  contents: write

jobs:
  flatpak:
    name: Flatpak package
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Check that every version matches the tag
        run: |
          version=$(sed -n "s/^  version: '\(.*\)',$/\1/p" meson.build)
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          lock_version=$(grep -A1 '^name = "pigoune-app"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          release_version=$(sed -n 's/^ *<release version="\([^"]*\)".*/\1/p' data/io.github.gor3pig.Pigoune.metainfo.xml.in | head -n 1)
          for found in "meson.build:$version" "Cargo.toml:$cargo_version" "Cargo.lock:$lock_version" "metainfo release:$release_version"; do
            if [ "v${found#*:}" != "$TAG" ]; then
              echo "${found%%:*} says ${found#*:}, but the tag is $TAG"
              exit 1
            fi
          done
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build the package
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --force-clean --repo=repo build build-aux/io.github.gor3pig.Pigoune.json
          updates=()
          if [ -f website/pigoune.gpg ]; then
            updates=(--repo-url=https://gor3pig.github.io/Pigoune/repo/ --gpg-keys=website/pigoune.gpg)
          fi
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            "${updates[@]}" repo "pigoune-$VERSION.flatpak" io.github.gor3pig.Pigoune

      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "Pigoune $VERSION" \
              --notes "Release notes to be written before publishing."
          fi
          gh release upload "$TAG" "pigoune-$VERSION.flatpak" --clobber
