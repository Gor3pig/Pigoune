[package]
name = "pigoune-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "pigoune"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_9"] }
async-channel = "2.5.0"
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_22"] }
pigoune-core = { path = "../pigoune-core" }

[build-dependencies]
glib-build-tools = "0.22.8"
