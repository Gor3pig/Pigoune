[package]
name = "pigoune-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "1.8.7"
imagesize = { version = "0.15.0", default-features = false, features = ["bmp", "gif", "heif", "jpeg", "jxl", "png", "psd", "tiff", "webp"] }
miniz_oxide = "0.9.1"
roxmltree = "0.21.1"
rusqlite = { version = "0.41.1", features = ["bundled", "fallible_uint"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.21"
unicode-normalization = "0.1.25"
uuid = { version = "1.26.1", features = ["v7"] }

[features]
migration-stops = []

[dev-dependencies]
pigoune-core = { path = ".", features = ["migration-stops"] }
tempfile = "3.27.0"
